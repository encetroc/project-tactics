<main id="checklist"></main>
<script>
const data = {"sections": [{"title": "1. Ankama games", "games": [{"title": "DOFUS — main PC game", "items": ["**Combat — turns/resources:** Individual turns in an initiative-ordered timeline; separate action points (**PA**) and movement points (**PM**); spells and weapon attacks spend PA.", "**Combat — space/interactions:** Spell-specific range, line of sight, cast limits and cooldowns; tackle/dodge constrains disengagement; displacement, obstacles, summons, glyphs, traps and status interactions depend on class.", "**Units — player characters:** Class + level + allocated characteristics + class spells/variant choices + equipment. Elemental damage, resistances, PA/PM, range, tackle/dodge and other modifiers shape a build. Spell variants are choices, not unrestricted access to every variant simultaneously.", "**Units — other entities:** Companions have their own defined kits; class summons are a separate category and are not a universally recruitable monster roster. Equipment pets/mounts are not automatically independent combatants.", "**Acquisition — permanent:** Create a class character and develop it; form a party with other players. Companion signs come from sources such as achievements, quests, exchanges or the shop, depending on companion.", "**Acquisition — deployment:** Equip a companion to bring a controlled extra unit where allowed; summon class entities through combat abilities. Do not import WAKFU's same-account Heroes system into this description."], "sources": "Sources: [combat foundations, C][dofus-combat]; [class catalogue, P][dofus-classes]; [companions/acquisition, C][dofus-companions]."}, {"title": "WAKFU", "items": ["**Combat — turns/resources:** Individual turns; initiative establishes ordering with team interleaving. PA and PM fund actions/movement; **PW** is an additional class resource whose spending/recovery depends on the kit.", "**Combat — space/interactions:** Spell-specific range and line of sight; facing/back attacks; tackle/dodge; armor, elemental resistances, displacement, battlefield objects and class-specific setup/combo mechanics.", "**Units — composition:** Class + level + aptitude allocations + equipment + a prepared deck of active spells and passives. A hero is a full player character; a companion has a narrower predefined kit; a summon belongs to its summoner's mechanics.", "**Acquisition — characters:** Create characters and join other players. On eligible servers, Heroes lets one account field additional characters from that account; it is not recruitment of arbitrary NPC enemies.", "**Acquisition — companions/summons:** Companions are unlocked/acquired separately, including in-game and shop sources; class abilities supply summons, with class-specific rules.", "**Restrictions:** Heroes/companions are not universal across servers; the Ogrest mono-account rules exclude companions. Keep those constraints separate from the combat model itself."], "sources": "Sources: [combat rules, C][wakfu-combat]; [company/Heroes, C][wakfu-heroes]; [classes, P][wakfu-classes]; [Ogrest restrictions, P][wakfu-ogrest]."}, {"title": "WAVEN — early-access model, 2023–2024 reference", "items": ["**Combat — turns/resources:** Small grid arenas; PA-funded spell-card play, movement, melee attacks, and a reserve-PA mechanic. The movement/melee commitment differs from freely spending DOFUS-style PM between attacks.", "**Combat — spell cycle:** Prepare a spell deck, draw a hand, and cycle played spells back through the deck. Spell effects, elemental states and triggered effects support sequencing/combinations.", "**Combat — companions:** Generate elemental gauges through qualifying effects, then spend them to deploy selected companions. Companions are controlled battlefield units, not merely passive equipment bonuses.", "**Units — hero:** Class/weapon archetype determines a recognizable core kit/passive; level, upgrades, spell selection and equipment modify the build.", "**Units — companions:** Defined health, attack, movement and special effects; some contribute spells or conditional triggers. Build preparation selects which companions can be brought into combat.", "**Acquisition:** Create/select a hero archetype; acquire companion collection entries through rewards/chests and develop them through the collection/upgrade system. Unlocking a companion and paying its in-combat summon cost are separate steps.", "**Version boundary:** Older alpha guides contain obsolete equipment/deck details. Later redesign announcements discuss different deck/companion resources; they are **not asserted as live rules here**. Exact current deck sizes, range/line-of-sight rules and reserve behavior require a pinned-client check before a detailed comparison."], "sources": "Sources: [early-access publisher factsheet, P][waven-factsheet]; [historical combat guide, C — alpha details must not be treated as current][waven-combat]; [collection/chests, C — search-index evidence; direct page blocked][waven-chests]; [official announcement index, P — version follow-up, not proof of deployment][waven-news]."}]}, {"title": "2. Classic tactical RPGs and class-building systems", "games": [{"title": "Final Fantasy Tactics — original / The War of the Lions", "items": ["**Combat:** Individual turns driven by charge time/speed, rather than whole-army phases; move and act on a height-aware grid; facing, attack range, jump capability and delayed spell resolution matter.", "**Units — human builds:** Base stats including HP/MP, Speed, Brave and Faith; current job + secondary action set + reaction/support/movement abilities + equipment. Job points unlock abilities and job access.", "**Units — monsters:** Species-specific stats, movement and ability sets rather than the human job/equipment model.", "**Acquisition — humans:** Hire generics through the recruitment office; gain unique characters through campaign events and optional conditions.", "**Acquisition — monsters:** Persuasion/recruitment abilities can add eligible enemies; roster monsters can produce eggs that hatch into monsters in their family. This is not player-directed two-parent component recombination.", "**Edition boundary:** The War of the Lions adds jobs and characters; do not assume every job or recruitment option exists in the original release."], "sources": "Sources: [jobs/builds, C][fft-jobs]; [War of the Lions guide including recruitment/monsters, C][fft-guide]."}, {"title": "Final Fantasy Tactics Advance", "items": ["**Combat:** Individual turns on a height-aware grid; range, facing and terrain; Judges enforce battle laws restricting actions, with penalties for violations.", "**Units — composition:** Species restricts available jobs. Primary job + secondary abilities + reaction/support options + equipment; equipment teaches abilities through ability-point accumulation.", "**Units — roster:** A persistent clan of named and generic characters; deploy a subset for each battle rather than produce soldiers on the battlefield.", "**Acquisition:** Initial members, campaign/quest recruits and recruitment offers associated with missions/items; some special recruits have additional conditions.", "**Distinctive constraint:** A build's available actions can conflict with an encounter's laws, affecting deployment and action selection."], "sources": "Sources: [mechanics/recruitment guide, C][ffta-guide]."}, {"title": "Final Fantasy Tactics A2: Grimoire of the Rift", "items": ["**Combat:** Individual-turn, height-aware grid combat; revised Judge/law rules reward compliance through clan benefits rather than simply reusing Advance's punishment system. MP builds during combat, affecting opening spell access.", "**Units — composition:** Expanded species-dependent jobs; equipment-based ability learning; primary/secondary action sets and passive/reaction choices; persistent individual growth.", "**Acquisition:** Campaign/quest recruits and recruitment events. The repeatable **Clan Mates** quest uses calendar timing and questionnaire answers to influence a candidate's species/job, subject to unlocks.", "**Roster/deployment:** Maintain a clan, deploy a limited party and send suitable members on dispatch assignments; dispatching is not mid-battle unit production."], "sources": "Sources: [general guide, C][ffta2-guide]; [Clan Mates recruitment, C][ffta2-clan]."}, {"title": "Tactics Ogre: Let Us Cling Together — PSP, 2010", "items": ["**Combat:** Individual turns on a height-aware grid; recovery time influences when units act again; movement, equipment weight, range, terrain and status effects shape encounters.", "**Units — composition:** Race/species, class, equipment, spells and equipped skills; humans and nonhuman/monster units have different class possibilities.", "**Progression boundary:** Levels belong to classes across the army in this edition. This is different from Reborn's individual-unit leveling.", "**Acquisition:** Hire generics; use appropriate recruitment skills to persuade eligible enemies, including nonhuman units; obtain unique recruits through route/event conditions.", "**Deployment:** Select a force from a persistent army; no routine battlefield production."], "sources": "Sources: [PSP systems overview, S][ogre-psp]; [monster recruitment guide, C][ogre-recruit]; [publisher comparison with Reborn, P][ogre-reborn]."}, {"title": "Tactics Ogre: Reborn", "items": ["**Combat:** Individual recovery-time turns, grid height, movement types and ranged/magic targeting; battlefield buff cards add temporary opportunities; the Chariot system allows revisiting previous decisions.", "**Units — composition:** Individual level + class + elemental affinity + equipment + selected skills/spells/items. Skills and spells have bounded loadout slots.", "**Progression:** Units level individually; the campaign's Union Level limits available leveling. Do not reuse the PSP class-level model.", "**Acquisition:** Hire generics, recruit eligible enemies through race/species-appropriate persuasion skills, and unlock special characters through campaign/route conditions. Monsters can be permanent army members.", "**Deployment:** Pick a limited force from the army; class choice and recruitment eligibility constrain which combinations are possible."], "sources": "Sources: [publisher systems/edition comparison, P][ogre-reborn]; [Reborn recruitment discussion, C][ogre-reborn-recruit]."}, {"title": "Triangle Strategy", "items": ["**Combat:** Individual initiative turns; move and act; elevation, facing/back attacks and allied follow-up attacks reward positioning.", "**Combat — interactions:** Tactical points fund abilities; terrain can interact with fire, ice, water and lightning. Objective-specific battles are not always simple elimination.", "**Units — composition:** Distinct named characters with strongly differentiated roles, fixed ability identities, promotions, weapon-upgrade choices and accessories. Not a freely interchangeable FFT-style job catalogue.", "**Acquisition:** Campaign progression, branching decisions and conviction thresholds determine recruits; optional character episodes add eligible units.", "**Deployment:** Choose a subset of the acquired roster; no generic recruitment shop or ordinary enemy-capture system."], "sources": "Sources: [publisher description, P][triangle]; [character/build documentation, C][triangle-builds]."}, {"title": "Fell Seal: Arbiter's Mark — base game + Missions and Monsters", "items": ["**Combat:** Individual-turn grid tactics with elevation, movement/range constraints, statuses and class combos; MP availability grows during battle rather than enabling every expensive spell immediately.", "**Units — humans:** Stats and class growth + primary class + secondary ability set + equipped passives/counter ability + gear. Learn/unlock classes and combine their abilities.", "**Acquisition — base game:** Authored characters join through progression; recruit generics through guilds and develop them into desired builds.", "**Acquisition — expansion:** **Missions and Monsters** adds monster taming/recruitment and roster deployment alongside humans; this must not be attributed to the unexpanded base game.", "**Units — expansion monsters:** Species kit plus up to two optional monster subclasses; variants add abilities/passives rather than merely recoloring the creature.", "**Roster development:** Send units on guild missions for resources/unlocks; this is a separate acquisition/development layer from tactical deployment."], "sources": "Sources: [base-game class/equipment system, P][fell-base]; [expansion features, P][fell-dlc]; [advanced recruitment/build guide, C][fell-recruit]."}, {"title": "Disgaea series — Disgaea 5 Complete as reference", "items": ["**Combat:** Player-side and enemy-side turns on a grid; move units and queue/execute attacks; lifting, throwing, tower formations, team attacks and Geo effects alter positioning and damage opportunities.", "**Units — composition:** Named characters, human generics and monsters; class/rank, stats, weapon proficiencies, equipment, skills and **Evilities** (passives). Subclass mastery and reincarnation support extensive redevelopment.", "**Exceptional scaling:** Large numerical growth and equipment development are central; class/monster mechanics remain relevant alongside raw stats.", "**Acquisition:** Recruit/create unlocked generic human and monster classes through the recruiter; unlock additional options through progression/conditions; named characters join through events and included content.", "**Capture distinction:** Enemy capture feeds a prisoner-management system with multiple uses; capturing is not automatically identical to adding a usable squad member.", "**Version boundary:** These are Disgaea 5 examples, not a claim that every series entry has identical monster, capture or progression rules."], "sources": "Sources: [publisher description, P][disgaea]; [systems guide, C][disgaea-guide]."}, {"title": "Shining Force", "items": ["**Combat:** Individual-unit turns influenced by Agility; movement on a grid, terrain effects, melee/ranged attacks and MP-based spells.", "**Units — composition:** Named characters with class, level, HP/MP, attack, defense, agility, movement and compatible equipment; promotion upgrades their class identity rather than providing unrestricted multiclassing.", "**Acquisition:** Starting allies and campaign joins plus optional/missable recruits found by exploration, conversations and special actions.", "**Roster/deployment:** Maintain the Force and select its battle party; no generic hiring, normal enemy capture or battlefield production."], "sources": "Sources: [combat/progression reference, C][shining-tips]; [recruitment walkthrough, C][shining-guide]."}, {"title": "Shining Force II", "items": ["**Combat:** Individual-unit turns influenced by Agility; terrain-aware grid movement, melee/ranged weapons and MP-funded spells.", "**Units — composition:** Named class-based characters with levels, stats, equipment and learned spells; some promotion alternatives require special items.", "**Acquisition:** Campaign joins and optional recruits discovered through exploration/events; certain recruitment choices are mutually exclusive at the time they are offered.", "**Roster/deployment:** Persistent Force with a selected battle party; recruiting and promoting a character are separate operations."], "sources": "Sources: [mechanics and recruitment walkthrough, C][shining2-guide]."}, {"title": "Fire Emblem series — Three Houses", "items": ["**Combat:** Player/enemy phases; each unit moves and acts; terrain, range, counterattacks, attack speed and linked/support effects influence engagements.", "**Combat — resources:** Weapon durability and combat arts; magic has per-battle uses; battalions provide bonuses and limited-use gambits. Classic and Casual modes differ in treatment of fallen allies.", "**Units — composition:** Named individual + stat growth + trained skill ranks + certified class + equipped abilities/combat arts + weapons/accessories/battalion.", "**Acquisition:** Choosing a house gives a starting roster. Recruit eligible students/staff by meeting character-specific progression, skill/stat and support conditions; some characters are route-locked.", "**Deployment:** Select a limited team from the roster; training/reclassing changes a character's role without creating another unit."], "sources": "Sources: [Nintendo overview, P][fe-three]; [recruitment conditions, C][fe-three-recruit]."}, {"title": "Fire Emblem series — Engage", "items": ["**Combat:** Player/enemy phases; move and act; weapon advantage can inflict **Break**, suppressing counterattacks. Unit-type mechanics include chain attacks, guarding and terrain interactions.", "**Combat — Emblems:** Equipping an Emblem grants benefits; temporarily Engaging opens stronger skills/weapons, limited by Engage duration/recharge.", "**Units — composition:** Named character + stats/growth + class/unit type + weapon access + inherited skills + equipment + an assigned Emblem or Bond Ring.", "**Acquisition:** Campaign joins and optional recruitment through specific maps/talk actions. Emblems are acquired separately and augment characters; they are not ordinarily independent deployed combatants.", "**Version boundary:** Unlike Three Houses, this is not a battalion/instruction-driven recruitment and build system."], "sources": "Sources: [Nintendo combat/Emblem overview, P][fe-engage]; [recruitment guide, S][fe-engage-recruit]."}, {"title": "Fire Emblem: Awakening — added inheritance reference", "items": ["**Combat:** Player/enemy phases on a grid; weapon matchups, range, counterattacks and limited weapon durability. **Pair Up** lets two characters occupy one formation with a lead/support relationship and combat bonuses/assists.", "**Units — composition:** Character stats/growths, class options, learned/equipped skills and gear; class changes broaden build development.", "**Acquisition — ordinary:** Campaign recruits and optional map-specific recruits.", "**Acquisition — offspring:** Eligible parent pairings unlock child-character side maps after progression conditions. Children inherit aspects of parental stats/class access and skills; recruitment still occurs through the relevant map.", "**Comparison boundary:** This is authored child identities plus inheritance rules, not unlimited procedural breeding or freely recombined ability structures."], "sources": "Sources: [Nintendo manual, P][fe-awakening-manual]; [inheritance reference, C][fe-inheritance]; [recruitment, C][fe-awakening-recruit]."}, {"title": "Vandal Hearts — original", "items": ["**Combat:** Side-based turns on a height-aware grid; move and attack/use abilities; positioning, attack direction and class matchups matter.", "**Units — composition:** Fixed named cast with starting class, level, stats, weapons/armor and class-specific abilities. Promotions offer constrained specialization paths rather than free multiclass builds.", "**Acquisition:** Characters join through campaign progression; the roster is authored rather than generated or purchased from a generic recruit pool.", "**Deployment:** Fight with the available cast; mission conditions and survival matter, but there is no normal monster collection or battlefield production layer."], "sources": "Sources: [mechanics/walkthrough, C][vandal-guide]."}]}, {"title": "3. Creatures, persistent squads and combinatorial builds", "games": [{"title": "Fae Tactics", "items": ["**Combat:** Turn-based grid tactics with elevation, elemental counters, knockback and cooperative attacks. Context-sensitive targeting produces attack/assist/wait behavior rather than a conventional large spell menu for every action.", "**Units — composition:** Named leaders and summonable fae; elemental identity, stats, attack/assist/wait abilities, special traits and leader progression distinguish units.", "**Team composition:** Choose leaders, fae summons and supporting spells before battle; elemental relationships influence both damage and team utility.", "**Acquisition — leaders:** Gain named allies through campaign/optional encounters and develop their abilities.", "**Acquisition — creatures:** Collect fae talismans associated with defeated creatures to unlock summon options; collection unlock and deployment are separate. This is not a two-parent breeding system."], "sources": "Sources: [developer/publisher summary, P][fae-store]; [developer elements/assist explanation, P — pre-release, no numerical values carried over][fae-dev]; [released-game unit/talisman reference, C][fae-guide]."}, {"title": "The Banner Saga — first game", "items": ["**Combat:** Alternating allied/enemy unit activations until the battle enters its final Pillage state; movement/attacks on a grid. Human and varl units occupy different footprints.", "**Combat — resources:** **Strength** is both health and attack potential; **Armor** mitigates strength damage. Attacks can target armor or strength; willpower can enhance actions, constrained by exertion.", "**Units — composition:** Named unit with class-specific ability, strength/armor, break, willpower/exertion, movement and stat caps; promotions allocate improvements and allow equipment benefits.", "**Acquisition:** Starting roster and event/choice-dependent joins; availability and losses persist through the campaign.", "**Roster/deployment:** Choose a small battle team from the caravan's fighters; no generic shop recruitment or normal enemy capture."], "sources": "Sources: [combat primer, C][banner-combat]; [campaign/recruitment walkthrough, C][banner-guide]."}, {"title": "Wildermyth", "items": ["**Combat:** Side-based grid turns with an action-point economy; walling and flanking create competing positional incentives. Mystics **interfuse** with scenery to create attacks and other effects.", "**Units — composition:** Individual hero + warrior/hunter/mystic class + level-up ability choices + weapons/armor + relationships and event-driven transformations. Transformations can replace body parts and add mechanics.", "**Acquisition:** Start with generated/customizable heroes; recruit more during campaigns through recruitment opportunities/events.", "**Persistence:** Save heroes into a **Legacy** roster and recruit them in later campaigns, subject to campaign rules; aging, retirement and losses affect roster continuity.", "**Distinction:** Generated identity and event-driven changes create individualized units without relying on a fixed complete kit for every character."], "sources": "Sources: [developer description, P][wilder-store]; [developer-hosted guide/wiki, C][wilder-guide]."}, {"title": "TROUBLESHOOTER: Abandoned Children", "items": ["**Combat:** Individual turns scheduled by an action-time system; actions and effects change future timing. Cover, elevation, hit/critical chances, statuses and reactions interact with active abilities.", "**Units — human builds:** Named characters with stats, class options, equipment and extensive **Mastery** boards; combinations of masteries unlock additional set effects.", "**Units — beasts:** Species, development/evolution, innate traits/masteries and loyalty distinguish tamed beasts; they are not simply human characters with a different appearance.", "**Units — drones:** Crafted mechanical units use configurable parts/modules and their own equipment/build rules.", "**Acquisition:** Human characters join through progression; recruiting the hunter enables beast taming, while the engineer enables drone crafting. Eligible field beasts are tamed through a combat process; not every enemy is capturable.", "**Deployment:** Select human operatives and use eligible character-specific beast/drone deployment mechanics; separate permanent collection from summoning a stored companion in a mission."], "sources": "Sources: [developer description, P][trouble-store]; [taming rules, C][trouble-beasts]; [drone reference, C][trouble-drones]."}, {"title": "Horizon's Gate", "items": ["**Combat:** Turn-based grid battles on land and at sea; movement, ability areas, terrain and environmental effects shape tactical decisions.", "**Units — composition:** Recruits have species, stats, equipment and class progression; combine class abilities/passives to build roles rather than only choosing complete fixed characters.", "**Team structure:** A selected landing party fights personal-scale battles; a larger crew/fleet supports naval encounters. Character and ship combat are related but distinct unit scales.", "**Acquisition:** Recruit crew at ports/through world encounters; access class trainers and unlocks to develop recruits. Acquire ships separately for the fleet.", "**Boundary:** Class unlocking changes the possibilities of an existing recruit; it is not itself acquisition of another combatant."], "sources": "Sources: [developer description, P][horizon-store]; [combat/build analysis, S][horizon-analysis]."}, {"title": "Druidstone: The Secret of the Menhir Forest", "items": ["**Combat:** Side-based tile-grid missions with movement/actions, limited-use abilities, positional threats and explicit mission objectives; efficient sequencing matters.", "**Units — composition:** Authored heroes with distinct roles and abilities; equipment and upgrade gems modify capabilities, including how abilities perform.", "**Acquisition:** Campaign-defined party availability rather than an open generated recruitment pool; the core heroes are supplied by progression, not bought or captured.", "**Development:** Mission rewards and hidden treasure supply ability-upgrade resources; equipment acquisition improves existing units rather than producing new ones.", "**Boundary:** Do not infer random permanent level-up powers or a monster-collection system from the general tactical-RPG label."], "sources": "Sources: [developer feature description, P][druid-store]."}, {"title": "Brigandine: The Legend of Runersia — added creature-army reference", "items": ["**Combat:** **Hex-grid**, turn-based troop battles; terrain, elements, range, encirclement and unit skills matter.", "**Units — hierarchy:** Rune Knights lead groups of monsters; a knight's command capacity constrains the attached force. Knights and monsters both have levels, classes, stats, skills and development/equipment options.", "**Acquisition — knights:** Begin with a faction's knights; gain additional knights through quest/event recruitment conditions.", "**Acquisition — monsters:** Spend mana to summon monsters at bases; base access influences available summons. Monsters persist and develop through class/evolution paths rather than being disposable spell effects only.", "**Comparison boundary:** Summoning an army member between battles differs from paying an in-combat resource to create a temporary unit."], "sources": "Sources: [publisher description, P][brig-store]; [publisher system page, P — indexed evidence; direct page returned maintenance][brig-system]."}]}, {"title": "4. Compact arenas, displacement and tactical puzzles", "games": [{"title": "Into the Breach — including Advanced Edition", "items": ["**Combat:** Small **8×8** grids; player-side actions respond to telegraphed enemy attacks before those attacks resolve. Move and use an action; displacement, blocking spawns, environmental hazards and redirecting attacks can be more useful than damage.", "**Objectives/resources:** Protect buildings and the shared power grid while completing mission objectives; not every enemy needs to die. Limited-use weapons and reactor allocation constrain options.", "**Units — composition:** Three deployed mechs; chassis/class + weapons + reactor-powered upgrades + pilot. Pilots bring skills/experience distinct from the mech's loadout.", "**Acquisition:** Select unlocked squads at run start; unlock more squads through achievements/currency. Find/recruit pilots and acquire weapons through mission/island rewards and shops.", "**Persistence:** A surviving pilot can carry into another timeline; this is not a campaign that continually expands the active mech count."], "sources": "Sources: [developer description/Advanced Edition, P][breach-store]; [mechanics guide, C][breach-guide]."}, {"title": "Tactical Breach Wizards", "items": ["**Combat:** Side-based room-scale grid encounters; preview consequences and rewind experiments. Knockback, windows, hazards, obstacles and ability combinations create displacement puzzles.", "**Units — composition:** Authored wizards have distinct ability sets; progression adds upgrades that change spell utility and combo opportunities.", "**Acquisition:** Wizards become available through campaign progression; deployment is scenario-dependent, not a recruitment market or enemy-capture loop.", "**Development:** Customize the abilities of existing characters; the main source of variety is interaction between kits and rooms rather than randomized recruit stats."], "sources": "Sources: [developer description, P][wizard-store]."}, {"title": "Mario + Rabbids Kingdom Battle — base campaign", "items": ["**Combat:** Player/enemy phases on a grid; cover, hit chances and weapon range; movement can chain dashes, team jumps and pipe traversal.", "**Action structure:** Movement, weapon attacks and techniques have separate allowances/constraints; movement itself can generate offense/support through character abilities.", "**Units — composition:** Fixed heroes with health/movement stats, primary/secondary weapons, techniques and skill-tree upgrades; select a small team with complementary roles.", "**Acquisition:** Unlock heroes through campaign progression; no generic hiring or normal monster capture. Purchase/unlock weapons separately.", "**Edition boundary:** This row does not describe Sparks of Hope or assume its Sparks system exists here."], "sources": "Sources: [Ubisoft game reference, P][rabbids-kb]; [comparison establishing the sequel's removal of the grid, S][rabbids-grid]."}, {"title": "Fights in Tight Spaces — base game", "items": ["**Combat:** One agent on a small grid; turns are driven by a hand of cards and **momentum**. Cards supply movement, attacks, defense and displacement.", "**Combat — interactions:** Manipulate enemy positions/attack directions, use scenery and arrange enemies to hit one another; defensive preparation competes with offense and movement.", "**Units — composition:** The agent's current deck, health and enhancements define the build more than a class/equipment roster of many soldiers.", "**Acquisition:** Choose an unlocked starting deck; acquire/remove/upgrade cards and enhancements during the run. Usually acquire **actions**, not additional permanent combat units.", "**Boundary:** The base game is a single-combatant reference, not evidence of a squad-recruitment system; expansion-specific companions are not assumed here."], "sources": "Sources: [developer description, P][fights-store]."}]}, {"title": "5. Cover, attrition and stealth squads", "games": [{"title": "XCOM: Enemy Unknown — base game", "items": ["**Combat:** Player/alien phases on a grid; typically two actions, with many attacks ending the turn. Cover, flanking, line of sight, elevation, overwatch and probabilistic shots matter.", "**Units — composition:** Individual soldiers with rank, stats, assigned class, selected class perks, armor, weapons and items; injuries and permanent death affect the roster.", "**Acquisition:** Hire rookies through headquarters; rewards can provide trained soldiers. Rookies develop into classes through promotion rather than being hired with an arbitrarily assembled kit.", "**Nonhuman unit option:** Manufacture **SHIV** robotic combat units through the engineering layer; these have different progression rules from soldiers.", "**Boundary:** Enemy Within's MEC conversion and gene modification are expansion systems, not base Enemy Unknown features."], "sources": "Sources: [publisher description, P][xcom-eu]; [SHIV/build reference, C][xcom-shiv]."}, {"title": "XCOM 2 — base game", "items": ["**Combat:** Player/alien phases, cover and probabilistic fire; concealment and ambush setup add a pre-engagement information layer; timed objectives can pressure movement.", "**Units — composition:** Soldier stats/rank + class skill choices + weapons/upgrades + armor/items; class abilities can modify the usual action economy.", "**Acquisition:** Recruit rookies through the Avenger and gain personnel from rewards/other campaign opportunities; train eligible rookies into chosen classes through the Guerrilla Tactics School.", "**Special development:** Psi Operatives use a separate training facility and progression path; developing one transforms a recruit's role rather than creating a new species.", "**Boundary:** SPARKs require Shen's Last Gift; faction heroes require War of the Chosen. Neither is silently included in this base-game row."], "sources": "Sources: [publisher description, P][xcom2]; [systems/training reference, C][xcom2-guide]."}, {"title": "Battle Brothers", "items": ["**Combat:** **Hex-grid**, initiative-based individual turns; action points and accumulated fatigue constrain actions. Armor, health, morale, injuries, elevation, surrounding and zones of control interact.", "**Units — composition:** Procedurally differentiated mercenaries with background, traits, base attributes and growth potential; level-up attributes/perks and equipment define roles without mandatory fixed classes.", "**Equipment mechanics:** Weapons supply different actions and armor interactions; heavy gear affects fatigue. A recruit's role can change through equipment and development.", "**Acquisition:** Pay to hire settlement recruits; some events provide additional recruitment opportunities. Hiring cost, wages and uncertainty about a recruit are acquisition constraints.", "**Persistence:** Maintain active and reserve brothers; injuries/death can remove or compromise individuals. No ordinary battlefield production or general monster capture system."], "sources": "Sources: [developer combat/recruitment/build description, P][brothers-store]."}, {"title": "Invisible, Inc.", "items": ["**Combat:** Side-based tile-grid stealth; agent action points, facing/vision, cover, doors and sound determine safe movement. Security alarm escalation makes time costly.", "**Actions/resources:** Knock out/pin or evade guards, ambush, hack devices through Incognita using shared power; weapons/items can have ammunition, charge or cooldown limitations. Elimination is usually not the objective.", "**Units — composition:** Agents have individual starting traits/augmentations plus upgradeable skills, limited inventory and acquired equipment. Incognita's programs are a shared support layer, not another moving agent.", "**Acquisition:** Choose starting agents from unlocked options; rescue additional operatives from detention missions, subject to roster limits.", "**Persistence:** Develop the team over a run; campaign unlocks broaden future starting choices. Rescuing an agent differs from purchasing gear or hacking a temporary device."], "sources": "Sources: [developer description, P][invisible-store]; [campaign/mechanics guide, C][invisible-guide]."}]}, {"title": "6. Armies, production and creature stacks", "games": [{"title": "The Battle for Wesnoth", "items": ["**Combat:** **Hex-grid**, side-based turns; movement points and an attack per activation. Terrain controls defense/movement; time of day modifies alignment-dependent damage; hit chance, resistances and retaliation shape matchups.", "**Units — composition:** Faction/type + level + traits + movement/resistance profile + melee/ranged attacks with damage types and specials. Experience can lead to branching advancement.", "**Acquisition:** A leader recruits from a permitted list at a keep/castle using gold; villages support income and upkeep. Scenarios can also provide special joins.", "**Persistence:** Campaigns commonly allow paid **recall** of surviving veterans; recruitment of a new unit and recall of an existing one are distinct.", "**Boundary:** Campaign recruitment lists and special rules vary; the core game does not require every scenario to offer the same units or advancement paths."], "sources": "Sources: [official project/manual entry, P][wesnoth-manual]; [project overview, P][wesnoth-project]."}, {"title": "Advance Wars — first game / Re-Boot Camp's AW1 campaign", "items": ["**Combat:** Side-based grid turns; move and act; terrain defense, fog of war, transports and direct-versus-indirect fire matter. Unit damage generally decreases with remaining health.", "**Resources:** Units have fuel and ammunition; captured properties generate funds and supply services. Capturing HQ or destroying the opposing force can decide battles, with scenario-specific alternatives.", "**Units — composition:** Fixed military unit types with health, movement mode, attack ranges, ammunition and matchup strengths; the commanding officer provides army-level modifiers and a charged CO Power.", "**Acquisition:** Produce units during battles at appropriate bases/airports/ports by paying funds; some missions instead provide a fixed force.", "**Persistence:** Ordinary units do not form a persistent, individually leveled campaign roster; available COs are a separate unlock/selection layer."], "sources": "Sources: [Nintendo remake overview, P][aw-nintendo]; [unit/rules reference, C][aw-wiki]."}, {"title": "Advance Wars 2: Black Hole Rising / Re-Boot Camp's AW2 campaign", "items": ["**Combat:** Retains AW1's grid turns, terrain, capture, direct/indirect fire, supply and health-dependent combat.", "**Units — composition:** Expanded unit/CO roster; officers have both normal and stronger **Super CO Powers**, adding timing choices to army-wide advantages.", "**Acquisition:** Battlefield production using property income; map-defined starting units and mission restrictions; CO access/unlocks remain separate from buying troops.", "**Boundary:** Do not import later games' mechanics, such as Dual Strike's paired-CO system, into AW2."], "sources": "Sources: [Nintendo remake overview, P][aw-nintendo]; [series edition/unit documentation, C][aw-wiki]."}, {"title": "Wargroove", "items": ["**Combat:** Side-based grid turns; capture towns for income, recruit at production structures and exploit terrain, range and transport.", "**Units — composition:** Defined troop types with health, movement and attack matchups; each type has a specific condition for a guaranteed critical hit. Factions largely share corresponding ordinary unit mechanics.", "**Commanders:** A deployed commander is a powerful battlefield unit with a distinct charged **Groove**; commander choice is not merely a cosmetic faction label.", "**Acquisition:** Spend funds on units at appropriate structures during battle; scenarios also supply starting armies. Commanders are selected/unlocked separately.", "**Persistence:** Standard skirmish troops are battle-local rather than a persistent individually trained roster."], "sources": "Sources: [developer gameplay guide, P][wargroove-play]; [unit conditions/stats, C][wargroove-units]."}, {"title": "Wargroove 2", "items": ["**Combat:** Retains grid-based army turns, capture/income, production, terrain and conditional unit criticals; commanders can charge stronger **Supercharged Grooves**.", "**Units — composition:** Fixed troop archetypes plus distinctive commanders; army composition and battlefield positioning are central. Collectible items can grant an ordinary unit special, Groove-like abilities, adding individual development within the relevant mode.", "**Acquisition — campaign/skirmish:** Buy units at battlefield production structures where the map permits.", "**Acquisition — Conquest:** Start a run with an army and add recruits through the run's opportunities/events; surviving troops persist between encounters and lost troops are not automatically replaced.", "**Mode boundary:** Conquest's persistent recruitment/attrition loop must not be generalized to every skirmish or campaign map."], "sources": "Sources: [developer Conquest explanation, P — development-era design article][wargroove-conquest]; [release description, P][wargroove2-store]."}, {"title": "Heroes of Might and Magic III — added stack-combat reference", "items": ["**Combat:** Separate **hex-grid** battle arenas; creature-stack turns depend largely on speed, with wait/defend and retaliation rules. Heroes support combat with spells rather than normally occupying a moving combat tile themselves.", "**Units — composition:** A battlefield piece is a **stack of identical creatures**: count + creature-type health, attack/defense, damage, speed, shots and special abilities. Hero stats, skills, artifacts and spells modify the army.", "**Army structure:** A hero carries up to seven stacks. Splitting/merging changes the number of activations and distribution of damage without inventing a new creature species.", "**Acquisition:** Recruit creatures from towns and dwellings, constrained by growth availability and resource cost; some neutral groups can join. Certain abilities/spells can also create or recover creatures.", "**Persistence:** Creature casualties reduce stack counts across encounters; heroes and surviving armies persist on the strategic map."], "sources": "Sources: [original publisher manual hosted with the Steam edition, P][heroes-manual]."}, {"title": "Warlock: Master of the Arcane — broader strategic reference", "items": ["**Combat:** Turn-based **hex-grid** fighting directly on the world map rather than a separate squad arena; terrain, movement, ranges, resistances and global spell support shape engagements.", "**Units — composition:** Unit type/race with stats, damage/resistance profile, abilities and acquired perks/upgrades; special lord units have additional equipment options in the relevant supported content.", "**Acquisition:** Train units through city buildings; summon units with spells; special resources/settlements unlock additional troop types. Availability is tied to territorial and building access.", "**Persistence:** Units survive and develop across world-map turns; losing them is an army loss, not just a temporary summon expiring by default.", "**Scope boundary:** Useful for acquisition/unit variety, but its 4X city layer is not a requirement for our combat design."], "sources": "Sources: [publisher description and content distinctions, P][warlock-store]; [terrain/combat reference, C][warlock-combat]."}]}, {"title": "7. Earlier suggestions retained for transparency, but outside the strict shortlist", "games": [{"title": "Mario + Rabbids Sparks of Hope — gridless exception", "items": ["**Combat:** Turn-based team combat with free movement inside a permitted region; **not grid-based movement** like Kingdom Battle.", "**Units — composition:** Fixed heroes with weapons, skill upgrades and equippable **Sparks** that grant abilities/passive benefits.", "**Acquisition:** Heroes and Sparks unlock through campaign/optional objectives; acquiring a Spark changes a hero's build rather than necessarily adding another independently controlled fighter.", "**Disposition:** Keep as an adjacent movement/build reference, not as evidence for a turn-based grid-combat shortlist."], "sources": "Sources: [Ubisoft game overview, P][rabbids-soh]; [grid-removal explanation, S][rabbids-grid]."}, {"title": "Tactical Nexus — optimization-puzzle exception", "items": ["**Combat:** Tile-based, deterministic tower/resource optimization; the key problem is choosing a route/order of encounters and stat gains, not commanding a squad through alternating tactical battle turns.", "**Units — composition:** One protagonist with changing numerical resources/stats, keys and upgrades; enemies are encounter obstacles rather than a recruitable army.", "**Acquisition:** No ordinary controllable squad recruitment; progression supplies resources and metaprogression bonuses, not a roster of independently built combatants.", "**Disposition:** My earlier classification was too broad. Retain only as an adjacent resource-tradeoff puzzle reference."], "sources": "Sources: [developer description, P][nexus-store]."}, {"title": "“Battle for Mana” — unverified title from the earlier list", "items": ["**Identity:** The earlier suggestion did not identify a verifiable specific game/edition; it should not have been presented as a confirmed example.", "**Combat:** Unverified — do not assign mechanics to this name.", "**Units/composition:** Unverified.", "**Acquisition:** Unverified.", "**Disposition:** Exclude from the research shortlist unless an exact title/link is supplied. **Warlock: Master of the Arcane** is documented separately above; it is not a substitute identity for this name."], "sources": ""}]}, {"title": "Evidence limitations and follow-up boundaries", "games": []}, {"title": "Source links", "games": []}], "refs": {"dofus-combat": "https://dofus.jeuxonline.info/article/1720/bases-combat", "dofus-classes": "https://www.dofus.com/fr/mmorpg/encyclopedie/classes", "dofus-companions": "https://www.dofuspourlesnoobs.com/les-compagnons.html", "wakfu-combat": "https://methodwakfu.com/bien-debuter/informations-generales/", "wakfu-heroes": "https://methodwakfu.com/bien-debuter/compagnie-et-heros/", "wakfu-classes": "https://www.wakfu.com/fr/mmorpg/encyclopedie/classes", "wakfu-ogrest": "https://support.ankama.com/hc/fr/articles/18654252593425--WAKFU-Serveurs-monocomptes-Ogrest", "waven-factsheet": "https://pressreleases.triplepointpr.com/wp-content/uploads/WAVEN_Factsheet_EN.pdf", "waven-combat": "https://waven.jeuxonline.info/article/14714/waven-bases-combat", "waven-chests": "https://waven.fandom.com/fr/wiki/Coffres", "waven-news": "https://steamcommunity.com/app/2343650/announcements/?l=french", "fft-jobs": "https://fantasyanime.com/finalfantasy/fftactics/fftactics_jobs.htm", "fft-guide": "https://www.neoseeker.com/final-fantasy-tactics-the-war-of-the-lions/faqs/156894-final-fantasy-tactics-wotl.html", "ffta-guide": "https://gamefa const storageKey = 'tactical-breeding-combat-reference-checklist-v1';
let saved = {};
try { saved = JSON.parse(localStorage.getItem(storageKey) || '{}') || {}; } catch { saved = {}; }
function appendInline(parent, text) {
  const pattern = /\*\*(.+?)\*\*|\[([^\]]+)\]\[([^\]]+)\]|\[([^\]]+)\]\((https?:[^)]+)\)/g;
  let previous = 0, match;
  while ((match = pattern.exec(text))) {
    parent.append(document.createTextNode(text.slice(previous, match.index)));
    if (match[1]) {
      const strong = document.createElement('strong'); strong.textContent = match[1]; parent.append(strong);
    } else {
      const label = match[2] || match[4];
      const url = match[3] ? data.refs[match[3]] : match[5];
      if (url) { const link = document.createElement('a'); link.href = url; link.textContent = label; parent.append(link); }
      else parent.append(document.createTextNode(label));
    }
    previous = pattern.lastIndex;
  }
  parent.append(document.createTextNode(text.slice(previous)));
}
function render() {
  const root=document.getElementById('checklist');
  data.sections.forEach((section,si) => {
    const h=document.createElement('h2'); h.textContent=section.title; root.append(h);
    section.games.forEach((game,gi) => {
      const card=document.createElement('section'); card.className='game';
      const title=document.createElement('h3'); title.textContent=game.title; card.append(title);
      game.items.forEach((text,ii) => {
        const id=`${si}-${gi}-${ii}`;
        const label=document.createElement('label'); label.className='item';
        const input=document.createElement('input'); input.type='checkbox'; input.checked=Boolean(saved[id]); input.dataset.id=id;
        const span=document.createElement('span'); appendInline(span,text);
        label.append(input,span); card.append(label);
      });
      if (game.sources) { const p=document.createElement('p'); p.className='sources'; appendInline(p,game.sources.replace(/^Sources:\s*/, '')); card.append(p); }
      root.append(card);
    });
  });
  root.addEventListener('change', event => {
    if (!event.target.matches('input[type=checkbox]')) return;
    saved[event.target.dataset.id]=event.target.checked;
    localStorage.setItem(storageKey,JSON.stringify(saved));
  });
}
document.getElementById('export').addEventListener('click', () => {
  const selectedByGame=new Map();
  document.querySelectorAll('.item input:checked').forEach(input => {
    const [si,gi,ii]=input.dataset.id.split('-').map(Number);
    const key=`${si}-${gi}`;
    if (!selectedByGame.has(key)) selectedByGame.set(key,{section:si,game:gi,items:[]});
    selectedByGame.get(key).items.push(ii);
  });
  let md='# Selected combat game reference\n\n';
  const usedRefs=new Set();
  for (const [key,selection] of selectedByGame) {
    const {section:si,game:gi,items}=selection, game=data.sections[si].games[gi];
    md+=`## ${game.title}\n\n`;
    for (const ii of items) md+=`- [x] ${game.items[ii]}\n`;
    if (game.sources) {
      md+='\n'+game.sources+'\n';
      for (const m of game.sources.matchAll(/\[[^\]]+\]\[([^\]]+)\]/g)) usedRefs.add(m[1]);
    }
    md+='\n';
  }
  if (!selectedByGame.size) md+='No items selected yet.\n';
  if (usedRefs.size) md+='\n'+[...usedRefs].filter(id=>data.refs[id]).map(id=>`[${id}]: ${data.refs[id]}`).join('\n')+'\n';
  const blob=new Blob([md],{type:'text/markdown;charset=utf-8'});
  const url=URL.createObjectURL(blob), a=document.createElement('a'); a.href=url; a.download='combat-game-reference-selected.md'; a.click(); URL.revokeObjectURL(url);
});
render();
</script>
