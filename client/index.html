<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Project Tactics — connection probe</title>
  <link data-trunk rel="rust" data-bin="project-tactics-client">
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #101827; color: #e5e7eb; }
    body { max-width: 1100px; margin: auto; padding: 24px; }
    h1 { font-size: 1.5rem; }
    #connection-status { white-space: pre-wrap; overflow-wrap: anywhere; padding: 16px; background: #1f2937; border-radius: 8px; }
    .scene { width: 100%; height: 420px; }
    canvas { display: block; width: 100%; height: 100%; }
    button { padding: 8px 16px; cursor: pointer; }
  </style>
</head>
<body>
  <h1>Project Tactics</h1>
  <p>Connection probe only. Open another tab to see connected clients appear.</p>
  <div class="scene"><canvas id="game" tabindex="0" aria-label="Bevy connected clients"></canvas></div>
  <p id="connection-status" role="status" aria-live="polite" data-state="loading">Loading WebAssembly…</p>
  <button type="button" onclick="location.reload()">Reconnect / reload</button>
  <noscript>This client requires JavaScript, WebAssembly and WebGL2.</noscript>
</body>
</html>
